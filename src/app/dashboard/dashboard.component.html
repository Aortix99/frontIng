<!-- 
  Template de Dashboard - Diseño con barra lateral izquierda
  Mantiene consistencia visual con el login usando los mismos colores y estilos
-->

<div class="dashboard-container">
  
  <!-- Sidebar Navigation -->
  <aside class="sidebar" [class.sidebar-collapsed]="sidebarCollapsed">
    <!-- Logo Section -->
    <div class="sidebar-header">
      <div class="logo-section">
        <h1 class="sidebar-title">Ing Civil</h1>
        <p class="sidebar-subtitle" *ngIf="!sidebarCollapsed">Sistema Estructural</p>
      </div>

    </div>

    <!-- User Info -->
    <div class="sidebar-user" *ngIf="currentUser && !sidebarCollapsed">
      <div class="user-avatar">
        <span class="avatar-initial">{{ getUserInitial() }}</span>
      </div>
      <div class="user-details">
        <span class="user-name">{{ currentUser.name }}</span>
        <span class="user-email">{{ currentUser.email }}</span>
      </div>
    </div>

    <!-- Navigation Menu -->
    <nav class="sidebar-nav">
      <ul class="nav-list">
        <li class="nav-item">
          <button type="button" class="nav-link" (click)="navigateToSection('inicio')" title="Inicio" [class.active]="isInicioActive()">
            <span class="nav-icon">🏠</span>
            <span class="nav-text" *ngIf="!sidebarCollapsed">Inicio</span>
          </button>
        </li>

        <li class="nav-item nav-group">
          <button
            type="button"
            class="nav-link nav-group-header"
            (click)="toggleMenuZapatas()"
            [class.active]="isZapatasGroupActive()"
            [attr.aria-expanded]="menuZapatasOpen"
            title="Cálculo de zapatas"
          >
            <span class="nav-icon">🏗️</span>
            <span class="nav-text" *ngIf="!sidebarCollapsed">Cálculo de zapatas</span>
            <span class="nav-chevron" *ngIf="!sidebarCollapsed" aria-hidden="true">{{ menuZapatasOpen ? '▲' : '▼' }}</span>
          </button>
          <ul class="nav-submenu" *ngIf="menuZapatasOpen && !sidebarCollapsed">
            <li class="nav-subitem">
              <button type="button" class="nav-link nav-sublink" (click)="navigateToSection('zapata-cuadrada-aislada')" [class.active]="isLastSegment('zapata-cuadrada-aislada')">Zapata cuadrada aislada</button>
            </li>
            <li class="nav-subitem">
              <button type="button" class="nav-link nav-sublink" (click)="navigateToSection('zapata-aislada')" [class.active]="isLastSegment('zapata-aislada')">Zapata esquinera</button>
            </li>
            <li class="nav-subitem">
              <button type="button" class="nav-link nav-sublink" (click)="navigateToSection('zapata-combinada')" [class.active]="isLastSegment('zapata-combinada')">Zapata combinada</button>
            </li>
            <li class="nav-subitem">
              <button type="button" class="nav-link nav-sublink" (click)="navigateToSection('zapata-excentrica-viga-amarre')" [class.active]="isLastSegment('zapata-excentrica-viga-amarre')">Zapata excéntrica — viga de amarre</button>
            </li>
          </ul>
        </li>

        <li class="nav-item nav-group">
          <button
            type="button"
            class="nav-link nav-group-header"
            (click)="toggleMenuVigas()"
            [class.active]="isVigasGroupActive()"
            [attr.aria-expanded]="menuVigasOpen"
            title="Vigas"
          >
            <span class="nav-icon">📏</span>
            <span class="nav-text" *ngIf="!sidebarCollapsed">Vigas</span>
            <span class="nav-chevron" *ngIf="!sidebarCollapsed" aria-hidden="true">{{ menuVigasOpen ? '▲' : '▼' }}</span>
          </button>
          <ul class="nav-submenu" *ngIf="menuVigasOpen && !sidebarCollapsed">
            <li class="nav-subitem">
              <button type="button" class="nav-link nav-sublink" (click)="navigateToSection('viga-tensor-zapata-aislada')" [class.active]="isLastSegment('viga-tensor-zapata-aislada')">Viga de amarre o conexión</button>
            </li>
            <li class="nav-subitem">
              <button type="button" class="nav-link nav-sublink" (click)="navigateToSection('viga-contrapeso')" [class.active]="isLastSegment('viga-contrapeso')">Viga de contrapeso</button>
            </li>
          </ul>
        </li>
      </ul>
    </nav>

    <!-- Logout Button -->
    <div class="sidebar-footer">
      <button class="logout-button" (click)="onLogout()" [title]="sidebarCollapsed ? 'Cerrar sesión' : ''">
        <span class="logout-icon">🚪</span>
        <span class="logout-text" *ngIf="!sidebarCollapsed">Cerrar Sesión</span>
      </button>
    </div>
  </aside>

  <!-- Main Content Area -->
  <main class="main-content">
    <!-- Header -->
    <header class="main-header">
      <div class="header-content">
        <h1 class="page-title">{{ getPageTitle() }}</h1>
        <div class="header-actions">
          <span class="welcome-text" *ngIf="currentUser">¡Hola, {{ currentUser.name }}!</span>
        </div>
      </div>
    </header>

    <!-- Content Area -->
    <div class="content-area">
      <!-- Router Outlet - Aquí se cargarán los componentes hijos -->
      <router-outlet></router-outlet>
    </div>
  </main>

  <!-- Loading Overlay -->
  <div class="loading-overlay" *ngIf="isLoading">
    <div class="loading-spinner"></div>
    <p class="loading-text">Cargando...</p>
  </div>

</div>
